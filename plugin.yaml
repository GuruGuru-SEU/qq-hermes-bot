name: qq-hermes-bot
label: QQ OneBot
kind: platform
version: 0.2.0
description: SnowLuma and NapCat QQ groups for Hermes, with group archives and isolated profiles.
author: GuruGuru-SEU
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - pre_auxiliary_call
  - post_auxiliary_call
provides_tools:
  - qq_history
  - qq_file
  - qq_image
  - qq_member_memory
  - qq_send
  - qq_task
python_dependencies:
  - aiohttp==3.14.5
  - Pillow==13.0.0
  - markdown-it-py==4.2.0
  - httpx==0.28.1
